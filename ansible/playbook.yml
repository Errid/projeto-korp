---
- name: Provisionar o ambiente Projeto Korp
  hosts: korp
  become: true
  gather_facts: true

  tasks:
    - name: instalar certificados
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: diretorio da key do docker
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: baixar a key do docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: repositorio para o apt do docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: instalar o docker atraves do repositorio
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-requests
        state: present

    - name: ativar o docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: criar rede Docker do projeto
      community.docker.docker_network:
        name: korp-network
        driver: bridge
        state: present
        appends: true

    - name: construir imagens e iniciar containers
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/.."
        state: present
        build: always

    - name: aguardar endpoint ficar disponivel
      ansible.builtin.uri:
        url: http://localhost/projeto-korp
        method: GET
        status_code: 200
        return_content: true
      register: endpoint_response
      retries: 15
      delay: 2
      until: endpoint_response.status == 200

    - name: validar conteudo do endpoint
      ansible.builtin.assert:
        that:
          - endpoint_response.json.nome == "Projeto Korp"
          - endpoint_response.json.horario is defined
        fail_msg: O endpoint respondeu, mas o JSON nao possui o conteudo esperado.
        success_msg: O endpoint respondeu corretamente.

    - name: mostrar resposta do endpoint
      ansible.builtin.debug:
        msg: "{{ endpoint_response.content }}"
